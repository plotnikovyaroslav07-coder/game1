  <script>
    (function () {
      var track = document.getElementById("track"),
          prev = document.getElementById("prev"),
          next = document.getElementById("next"),
          cards = Array.prototype.slice.call(track.children), index = 0;
      function css(n) { return parseFloat(getComputedStyle(track).getPropertyValue(n)) || 0; }
      function update() {
        var max = Math.max(0, cards.length - (css("--visible") || 5));
        index = Math.min(Math.max(index, 0), max);
        track.style.transform = "translateX(" + (-index * (cards[0].getBoundingClientRect().width + css("--gap"))) + "px)";
        prev.disabled = index === 0; next.disabled = index >= max;
      }
      prev.onclick = function () { index--; update(); };
      next.onclick = function () { index++; update(); };
      window.addEventListener("resize", update); update();
    })();
  </script>
